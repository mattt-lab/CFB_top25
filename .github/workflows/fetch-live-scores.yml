name: Fetch live scores

# Frequent, lightweight companion to fetch-data.yml -- patches live/final score, status, period,
# and clock into data/current.json between the heavy pipeline's once-daily runs, via CFBD's
# /scoreboard endpoint (one call per tick, whatever's currently live, regardless of how many games
# that is -- see scripts/fetch-live-scores.mjs for the full rationale). Never calls Claude.
#
# Unlike fetch-data.yml, the git add/commit/push (with retry) happens INSIDE the script itself, not
# in this workflow's shell steps -- a retry needs to reapply the already-fetched /scoreboard
# response against a freshly-reset base without paying for another CFBD call, which only the script
# (holding that response in memory) can do. This workflow just sets up the environment and git
# identity, then gets out of the way.
#
# Cadence: 15-minute polling across Thursday/Friday night primetime windows plus all of Saturday --
# each window is split across two cron lines because a US-evening window straddles the UTC
# calendar-day boundary (cron can't express an hour range that wraps midnight in one line). Windows
# are padded generously rather than precisely tracking US DST -- the script's own guard (skip
# entirely if nothing tracked is near kickoff) makes that padding free. This intentionally does NOT
# cover: bowl season (games scattered across many non-Thu/Fri/Sat weekdays in Dec/Jan) or midweek
# "MACtion" (Tue/Wed games, common Sept-Oct) -- both still get final-score coverage from the next
# scheduled fetch-data.yml run, just not live in-game tracking. Revisit if that gap matters more
# than the added CFBD-quota cost once real usage is measured (see the live-score architecture plan).
on:
  schedule:
    - cron: '*/15 23 * * 4'      # Thu night (late UTC)
    - cron: '*/15 0-4 * * 5'     # Thu night, continued (early UTC Friday)
    - cron: '*/15 23 * * 5'      # Fri night
    - cron: '*/15 0-4 * * 6'     # Fri night, continued (early UTC Saturday)
    - cron: '*/15 16-23 * * 6'   # Saturday slate (noon ET onward)
    - cron: '*/15 0-4 * * 0'     # Saturday night, continued (early UTC Sunday)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-live-scores
  # Unlike fetch-data.yml's cancel-in-progress: false -- a stale in-flight tick here is harmless to
  # cancel, since the next tick 15 minutes later supersedes it with fresher data anyway.
  cancel-in-progress: true

jobs:
  live-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check /scoreboard and patch live/final state
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/fetch-live-scores.mjs
