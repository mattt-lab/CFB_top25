name: Fetch CFB data

# Runs the full data pipeline (fetch -> score -> narrate) and commits the result straight to
# main, then explicitly dispatches deploy-pages.yml -- this workflow does not build/deploy
# itself. The explicit dispatch matters: a push made with this job's own GITHUB_TOKEN does NOT
# trigger deploy-pages.yml's `on: push` listener (GitHub's anti-recursion rule), so without it
# the site would silently never redeploy on a day nobody else happens to push something.
# data/rankings/*.json snapshots are append-only (never overwritten -- see
# scripts/fetch-cfb-data.mjs and docs/data-schema.md), so they accumulate in git history on
# purpose; only data/current.json is expected to change on every run.

on:
  schedule:
    # 13:00 UTC daily -- comfortably after CFBD/poll updates land, works year-round through the
    # season-changeover logic in scripts/lib/season.mjs (off-season runs just re-fetch the same
    # settled season, which is a harmless no-op commit-wise since nothing changes).
    - cron: '0 13 * * *'
    # Monday-only extra run, 19:30 UTC (2:30pm ET) -- the AP/Coaches poll normally lands Sunday
    # afternoon, well before the next 13:00 UTC run, but any week with games extending into
    # Sunday/Monday pushes the poll to Monday/Tuesday instead (confirmed live: Week 1->2 this
    # season). This second run is the cheap fix -- same script, same "skip commit if nothing
    # changed" behavior, just one more chance the same day to catch a same-day poll instead of
    # sitting stale until Tuesday morning. Not added to every day of the week: the risk is
    # specifically about a Monday-extending slate, not a daily one, so no reason to pay the extra
    # CFBD/Claude cost the other six days.
    - cron: '30 19 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-score-narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch CFBD data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/fetch-cfb-data.mjs

      - name: Stage 1 -- deterministic scoring
        run: node scripts/score.mjs

      - name: Stage 2 -- LLM narration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/narrate.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/rankings/
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Update CFB data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      # A push made with the default GITHUB_TOKEN does NOT trigger other workflows' `on: push`
      # listeners -- GitHub's built-in anti-recursion rule, meant to stop infinite automation
      # loops. Without this, deploy-pages.yml's `on: push: branches: [main]` silently never fires
      # from this workflow's own commits (confirmed live: the site sat on stale data for a full day
      # with no human push in between to accidentally trigger a deploy). A workflow_dispatch call
      # isn't subject to that same restriction, so trigger the deploy explicitly instead of relying
      # on the push event to cascade.
      - name: Trigger a redeploy
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --repo ${{ github.repository }}
