<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CFB HQ — Top 25 Tracker</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages) -- GH Pages has
      // no server-side routing, so a direct hit or refresh on a client-side route 404s to this
      // file. Encode the real path into a query string and bounce to index.html, which decodes
      // it back via history.replaceState before React Router mounts (see index.html).
      var pathSegmentsToKeep = 1; // keep "/CFB_top25" -- the project-page base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
