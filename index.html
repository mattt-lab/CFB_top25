    <!-- Google tag (gtag.js) -- same property as the F1 dashboard project.

    <script>

  <body>
    <div id="root"></div>
    <!-- GitHub Pages has no server-side routing, so a direct hit or hard refresh on a
         client-side route (e.g. /CFB_top25/team/ohio-state) 404s -- public/404.html redirects
         here with the real path encoded in the query string; this reverses that encoding via
         history.replaceState before React Router reads the URL. See rafgraph/spa-github-pages. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </body>
